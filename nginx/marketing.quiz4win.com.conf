# /etc/nginx/sites-available/marketing.quiz4win.com.conf
# Host-level reverse proxy in front of the docker-compose service that listens
# on 127.0.0.1:5806. SSL termination is expected to be added by certbot; see
# the commented block at the bottom of this file.

# Cache the upstream so reloads don't hard-fail when the container is briefly
# down during a deploy.
upstream quiz4win_marketing_upstream {
    server 127.0.0.1:5806 fail_timeout=5s max_fails=3;
    keepalive 32;
}

# Redirect plain HTTP to HTTPS once certbot has provisioned a certificate.
# Until then this server also serves the application directly.
server {
    listen 80;
    listen [::]:80;
    server_name marketing.quiz4win.com;

    # ACME http-01 challenge (uncomment when issuing/renewing certs).
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }

    # Once HTTPS is configured, replace the rest of this block with:
    #   return 301 https://$host$request_uri;

    client_max_body_size 100M;

    # Real client IP / scheme for the Next.js app.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_redirect off;
    proxy_buffering off;
    proxy_read_timeout  60s;
    proxy_send_timeout  60s;

    # Long-lived hashed assets emitted by Next.js can be cached aggressively.
    location /_next/static/ {
        proxy_pass http://quiz4win_marketing_upstream;
        proxy_cache_valid 200 30d;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # WebSocket support (HMR in dev, future SSE/realtime channels).
    location /_next/webpack-hmr {
        proxy_pass http://quiz4win_marketing_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://quiz4win_marketing_upstream;
    }

    # When the container is down, serve a tidy 502 instead of nginx defaults.
    error_page 502 503 504 = @fallback;
    location @fallback {
        default_type text/plain;
        return 502 "marketing.quiz4win.com is temporarily unavailable.\n";
    }
}

# After running:
#   sudo certbot --nginx -d marketing.quiz4win.com
# certbot will append the HTTPS server { } block below and rewrite the
# port-80 server to a 301 redirect. No manual edits required.
